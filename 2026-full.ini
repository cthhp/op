[custom]
; ==========================================================
; OpenClash SubConverter 自定义模板（整合版 2026-11-19）
; 基于用户提供的修订版 + 全部需求整合
; 1. 删除无效 GEOIP 应用名写法；category-games 兼容处理
; 2. DMM 默认日本；PS5 / Switch / Xbox 默认香港
; 3. Meta VR：香港优先探测，失败回退美国；Facebook 单独走香港
; 4. 日本/韩国/台湾区游戏按明确域名走对应区服节点
; 5. 富途牛牛 / 老虎证券 / 华盛 / 长桥 / 微牛等香港证券走香港
; 6. 国内服务强制直连（cn、google-cn、apple-cn、category-games、GEOIP CN、Aethersailor）
; 7. 漏网之鱼 / Default 优先「♻️ 自动选择」，未知流量尽量用当前能连通节点
; 8. 新增韩国 KR 节点组；冷门节点负向匹配五大区
; 9. 本文件是 SubConverter 模板，不是运行 YAML；DNS 由 OpenClash DNS/覆写单独处理
; ==========================================================
enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; 节点清洗：剔除机场展示/说明/防失联/流量提示节点
; ==========================================================
exclude=流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|官网地址|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website


; ==========================================================
; 1) 规则（自上而下优先级）
; ==========================================================
; --- 私网直连 ---
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve

; --- 游戏发行地区 / 账号地区：仅按明确的游戏域名匹配，不按 CDN/Anycast IP 国家判断 ---
; 重要：把实际能区分地区的专属域名放在这里；全球共用同一域名的游戏无法靠域名自动识别账号区

; --- 日本区游戏（常见有 IP/地区限制的日服） ---
; ウマ娘 Pretty Derby
ruleset=🕹️ 日本区游戏,[]DOMAIN-SUFFIX,umamusume.jp
ruleset=🕹️ 日本区游戏,[]DOMAIN-SUFFIX,cygames.jp
ruleset=🕹️ 日本区游戏,[]DOMAIN,api-umamusume.cygames.jp
; 公主连结 Re:Dive 日服
ruleset=🕹️ 日本区游戏,[]DOMAIN-SUFFIX,priconne-redive.jp
ruleset=🕹️ 日本区游戏,[]DOMAIN,api-priconne-redive.cygames.jp
ruleset=🕹️ 日本区游戏,[]DOMAIN,omotenashi.cygames.jp
; 其它常见日服相关
ruleset=🕹️ 日本区游戏,[]DOMAIN-SUFFIX,bandainamcoid.com
ruleset=🕹️ 日本区游戏,[]DOMAIN-SUFFIX,bandainamcoent.com

; --- 韩国区游戏（常见有 IP/地区限制的韩服） ---
; Nexon 系（冒险岛等）
ruleset=🕹️ 韩国区游戏,[]DOMAIN-SUFFIX,nexon.com
ruleset=🕹️ 韩国区游戏,[]DOMAIN-SUFFIX,nexon.co.kr
ruleset=🕹️ 韩国区游戏,[]DOMAIN-SUFFIX,maplestory.nexon.com
ruleset=🕹️ 韩国区游戏,[]DOMAIN-SUFFIX,maplestory.nexon.co.kr
ruleset=🕹️ 韩国区游戏,[]DOMAIN-SUFFIX,nexon.net
; 其它常见韩服
ruleset=🕹️ 韩国区游戏,[]DOMAIN-SUFFIX,plaync.com
ruleset=🕹️ 韩国区游戏,[]DOMAIN-SUFFIX,ncsoft.com

; --- 台湾区游戏（可按实际台服专属域名继续补充） ---
; ruleset=🕹️ 台湾区游戏,[]DOMAIN-SUFFIX,example-tw-game.com

; --- Facebook：单独走香港，不并入 Meta VR ---
ruleset=📘 Facebook,[]DOMAIN-SUFFIX,facebook.com
ruleset=📘 Facebook,[]DOMAIN-SUFFIX,facebook.net
ruleset=📘 Facebook,[]DOMAIN-SUFFIX,fbcdn.net
ruleset=📘 Facebook,[]DOMAIN-SUFFIX,fb.com
ruleset=📘 Facebook,[]DOMAIN-SUFFIX,fbsbx.com
ruleset=📘 Facebook,[]DOMAIN-SUFFIX,messenger.com
ruleset=📘 Facebook,[]DOMAIN-SUFFIX,m.me

; --- Meta Quest / Meta VR：只匹配 Quest / Oculus 专属域名 ---
; 不包含 meta.com、facebook.com、fbcdn.net，避免把 Facebook 整体送去美国
