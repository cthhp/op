ruleset=🕶️ Meta VR,[]DOMAIN-SUFFIX,oculuscdn.com
ruleset=🕶️ Meta VR,[]DOMAIN-SUFFIX,oculusstatic.com
ruleset=🕶️ Meta VR,[]DOMAIN-SUFFIX,quest.com

