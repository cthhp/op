[custom]
; ==========================================================
; OpenClash SubConverter 自定义模板（本地转换服务用，2026-11-18）
; 1. 删除 GEOIP JP/KR/TW 全局按目标 IP 国家分流，避免 CDN/Anycast 造成游戏区服错判
; 2. 游戏区服改为明确域名映射到发行地区/账号地区策略组；需补充实际游戏专属域名
; 3. Meta VR 仅匹配 Oculus / Quest 域名；Facebook 与 fbcdn 单独走香港
; 4. Meta VR 增加香港优先、香港探测失败时回退美国的策略组（仅为探测级故障切换）
; 5. 国内直连增强：cn、apple-cn、google-cn、category-games@cn、steam@cn、GEOIP CN 及 Aethersailor 直连补丁
; 6. 使用 Loyalsoldier GeoSite 支持的 category-games@cn；只覆盖标注 @cn 的游戏域名，不保证涵盖全部国内游戏
; 7. 保留 PS5 / Switch / Xbox 默认香港、DMM 默认日本、韩国节点组
; 8. 国内可连但规则未收录的网站，可在下方增加专属 DIRECT 域名规则
; 9. 本文件是 SubConverter 模板，不是规则集文件，也不是 Mihomo 运行 YAML；DNS 由 OpenClash DNS/覆写设置单独处理
; 本地 SubConverter: 可放入 /etc/subconverter/base/，订阅转换模板地址填写本文件名
; ==========================================================
enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; 节点清洗：剔除机场展示/说明/防失联/流量提示节点
; ==========================================================
exclude=流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|官网地址|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website


; ==========================================================
; 1) 规则（自上而下优先级）
; ==========================================================
; --- 私网直连 ---
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve

; --- 游戏发行地区 / 账号地区：仅按明确的游戏域名匹配，不按 CDN/Anycast IP 国家判断 ---
; 重要：把某个游戏实际使用、且能区分地区的专属域名填在下方。
; 同一游戏若全球共用完全相同的域名，路由器无法从网络包自动读出账号地区；这种情况需按设备源 IP 分流，或由游戏自身域名区分。
; 将这些专属域名规则放在国内通用直连规则之前，保证明确指定的游戏区服优先。
; 示例（请替换成真实游戏专属域名后再取消注释；不要照抄 example 域名）：
; ruleset=🕹️ 日本区游戏,[]DOMAIN-SUFFIX,example-jp-game.com
; ruleset=🕹️ 韩国区游戏,[]DOMAIN-SUFFIX,example-kr-game.com
; ruleset=🕹️ 台湾区游戏,[]DOMAIN-SUFFIX,example-tw-game.com

; --- Facebook：单独走香港，不并入 Meta VR 美国策略 ---
ruleset=📘 Facebook,[]DOMAIN-SUFFIX,facebook.com
ruleset=📘 Facebook,[]DOMAIN-SUFFIX,facebook.net
ruleset=📘 Facebook,[]DOMAIN-SUFFIX,fbcdn.net
ruleset=📘 Facebook,[]DOMAIN-SUFFIX,fb.com
ruleset=📘 Facebook,[]DOMAIN-SUFFIX,fbsbx.com
ruleset=📘 Facebook,[]DOMAIN-SUFFIX,messenger.com
ruleset=📘 Facebook,[]DOMAIN-SUFFIX,m.me

; --- Meta Quest / Meta VR：只匹配 Quest / Oculus 专属域名 ---
; 不包含 meta.com、meta.net、facebook.com、fbcdn.net，避免把 Facebook 网站/应用整体送去美国
ruleset=🕶️ Meta VR,[]DOMAIN-SUFFIX,oculus.com
ruleset=🕶️ Meta VR,[]DOMAIN-SUFFIX,oculuscdn.com
ruleset=🕶️ Meta VR,[]DOMAIN-SUFFIX,oculusstatic.com
ruleset=🕶️ Meta VR,[]DOMAIN-SUFFIX,quest.com

; --- 日本限定 / DMM ---
ruleset=🇯🇵 DMM日本,[]DOMAIN-SUFFIX,dmm.co.jp
ruleset=🇯🇵 DMM日本,[]DOMAIN-SUFFIX,dmm.com
ruleset=🇯🇵 DMM日本,[]DOMAIN-SUFFIX,dmmgames.com
ruleset=🇯🇵 DMM日本,[]DOMAIN-SUFFIX,dmmgames.co.jp

; --- Sony PlayStation / PS5：默认香港 ---
ruleset=🎮 Sony PS5,[]DOMAIN-SUFFIX,playstation.net
ruleset=🎮 Sony PS5,[]DOMAIN-SUFFIX,playstation.com
ruleset=🎮 Sony PS5,[]DOMAIN-SUFFIX,playstationnetwork.com
ruleset=🎮 Sony PS5,[]DOMAIN-SUFFIX,sonyentertainmentnetwork.com
ruleset=🎮 Sony PS5,[]DOMAIN-SUFFIX,psn.jp

; --- Nintendo Switch：默认香港 ---
ruleset=🎮 Nintendo Switch,[]DOMAIN-SUFFIX,nintendo.com
ruleset=🎮 Nintendo Switch,[]DOMAIN-SUFFIX,nintendo.net
ruleset=🎮 Nintendo Switch,[]DOMAIN-SUFFIX,nintendowifi.net
ruleset=🎮 Nintendo Switch,[]DOMAIN-SUFFIX,nintendo.co.jp
ruleset=🎮 Nintendo Switch,[]DOMAIN-SUFFIX,nintendo-europe.com
ruleset=🎮 Nintendo Switch,[]DOMAIN-SUFFIX,nintendo.co.uk

; --- Xbox：默认香港 ---
ruleset=🎮 Xbox,[]DOMAIN-SUFFIX,xbox.com
ruleset=🎮 Xbox,[]DOMAIN-SUFFIX,xboxlive.com
ruleset=🎮 Xbox,[]DOMAIN-SUFFIX,xboxservices.com
ruleset=🎮 Xbox,[]DOMAIN-SUFFIX,xboxab.com
ruleset=🎮 Xbox,[]DOMAIN-SUFFIX,xboxgamepass.com
ruleset=🎮 Xbox,[]DOMAIN-SUFFIX,gamepass.com

; --- 中国大陆可直连域名：专属 Facebook / Quest / DMM / 主机平台规则优先 ---
; Aethersailor 直连补丁：一般国内可直连域名优先直连
ruleset=DIRECT,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,28800
ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800
; 国内通用域名直连；Loyalsoldier 的 china-list.txt 是独立域名列表，不是 GEOSITE 分类，不在此写作 GEOSITE,china-list
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOSITE,apple-cn
ruleset=DIRECT,[]GEOSITE,google-cn
; Loyalsoldier GeoSite：仅直连被标记为 @cn 的游戏域名，不代表完整收录所有国内游戏
ruleset=DIRECT,[]GEOSITE,category-games@cn
; Steam 中国区有接入点域名
ruleset=DIRECT,[]GEOSITE,steam@cn
ruleset=DIRECT,[]GEOSITE,category-public-tracker
; 国内域名与国内游戏分类优先直连；GEOIP CN 在专属平台规则之后补漏
ruleset=DIRECT,[]GEOIP,cn

; --- 国内可直连但未被 GeoSite 收录的网站：按实际测试添加域名 ---
; 示例（替换为真实域名后取消注释）：
; ruleset=DIRECT,[]DOMAIN-SUFFIX,example-accessible-in-china.com

; GEOIP CN 不加 no-resolve：未命中专属域名规则且解析到中国大陆 IP 的流量直连

; --- Adobe 与核心应用 ---
ruleset=🟥 Adobe,[]GEOSITE,adobe
ruleset=📦 Notion,[]GEOSITE,Notion
ruleset=📨 Telegram,[]GEOSITE,telegram
ruleset=🤖 ChatGPT,[]GEOSITE,openai
ruleset=🧠 AI,[]GEOSITE,category-ai-!cn
ruleset=🍎 Apple,[]GEOSITE,apple
ruleset=🎬 YouTube,[]GEOSITE,youtube
ruleset=🎥 Netflix,[]GEOSITE,netflix

; --- 海外主流应用补充 ---
ruleset=🎵 TikTok,[]GEOSITE,tiktok
ruleset=📸 Instagram,[]GEOSITE,instagram
ruleset=🐦 X,[]GEOSITE,twitter

; --- 开发 / 工具 ---
ruleset=🧑‍💻 GitHub,[]GEOSITE,github
ruleset=🚝 测速工具,[]GEOSITE,category-speedtest
ruleset=🎮 Steam,[]GEOSITE,steam

; --- 交易所 ---
ruleset=🟦 OKX,[]GEOSITE,okx
ruleset=🟨 Binance,[]GEOSITE,binance
ruleset=🟪 Bybit,[]GEOSITE,bybit

; --- 社交 / 通讯 ---
ruleset=📞 即时通讯,[]GEOSITE,category-communication
ruleset=💬 社交媒体,[]GEOSITE,category-social-media-!cn
ruleset=↔️ teamviewer,[]GEOSITE,teamviewer

; --- Google / Microsoft ---
ruleset=☁️ cloudflare,[]GEOSITE,cloudflare
ruleset=🔎 Google,[]GEOSITE,google
ruleset=🪟 Microsoft,[]GEOSITE,microsoft

; --- Aethersailor 代理补丁：仅兜底，不覆盖前面的直连和专属规则 ---
ruleset=🚀 手动选择,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml,28800
ruleset=🚀 手动选择,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800

; --- GFW 兜底 ---
ruleset=🚀 手动选择,[]GEOSITE,gfw

; --- 非标端口 ---
ruleset=🔀 非标端口,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,28800

; --- 最终兜底 ---
ruleset=🐟 漏网之鱼,[]FINAL


